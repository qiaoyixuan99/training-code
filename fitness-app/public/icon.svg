<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Dumbbell -->
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="32" stroke-linecap="round">
    <line x1="-120" y1="0" x2="120" y2="0"/>
    <rect x="-155" y="-40" width="50" height="80" rx="12" fill="white" stroke="none"/>
    <rect x="105" y="-40" width="50" height="80" rx="12" fill="white" stroke="none"/>
    <rect x="-175" y="-28" width="30" height="56" rx="8" fill="white" stroke="none"/>
    <rect x="145" y="-28" width="30" height="56" rx="8" fill="white" stroke="none"/>
  </g>
  <!-- Heart pulse -->
  <g transform="translate(256,360)" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-60,0 -30,0 -15,-25 0,15 15,-15 30,0 60,0"/>
  </g>
</svg>
